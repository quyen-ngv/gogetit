services:
  vocaberry-db:
    image: postgres:15-alpine
    container_name: vocaberry-db
    restart: always
    environment:
      POSTGRES_DB: vocaberry_db
      POSTGRES_USER: vocaberry
      POSTGRES_PASSWORD: vocaberry_secret
    ports:
      - "5432:5432"
    volumes:
      - vocaberry_db_data:/var/lib/postgresql/data
    networks:
      - vocaberry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocaberry -d vocaberry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GoRoute Database (separate from vocaberry)
  goroute-db:
    image: postgres:15-alpine
    container_name: goroute-db
    restart: always
    environment:
      POSTGRES_DB: goroute
      POSTGRES_USER: goroute
      POSTGRES_PASSWORD: goroute123
    ports:
      - "5433:5432"  # Different port to avoid conflict
    volumes:
      - goroute_db_data:/var/lib/postgresql/data
    networks:
      - vocaberry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goroute -d goroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  vocaberry-app:
    image: luxofons/vocaberry:0.0.94
    container_name: vocaberry-app
    restart: always
    user: "0:0"
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - vocaberry_lucene_data:/app/data
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      vocaberry-db:
        condition: service_healthy
    networks:
      - vocaberry-network

  # GoRoute App
  goroute-app:
    image: luxofons/goroute-app:0.4.19
    container_name: goroute-app
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://goroute-db:5432/goroute
      - DB_USERNAME=goroute
      - DB_PASSWORD=goroute123
      - JWT_SECRET=${GOROUTE_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - FIREBASE_CREDENTIAL_PATH=file:/app/goroute-credentials.json
      - SCRAPE_SERVICE_URL=http://google-maps-bot:8080
      - GOROUTE_INTERNAL_PUBLIC_BASE_URL=http://goroute-app:8080
      - GOROUTE_API_KEY=${GOROUTE_API_KEY:-}
      - SCRAPE_SERVICE_API_KEY=${PLACE_REFRESH_API_KEY:-}
      - SCRAPE_SERVICE_CALLBACK_TOKEN=${SCRAPE_SERVICE_CALLBACK_TOKEN:-}
    volumes:
      - ./goroute-credentials.json:/app/goroute-credentials.json:ro
    depends_on:
      goroute-db:
        condition: service_healthy
      google-maps-bot:
        condition: service_healthy
    networks:
      - vocaberry-network

  # Google Maps bot + scrape HTTP API (GoRoute calls http://google-maps-bot:8080)
  google-maps-bot:
    build: .
    image: luxofons/google-maps-bot:v0.2.13
    container_name: google-maps-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID:-5636346689}
      - PLACE_API_HOST=0.0.0.0
      - PLACE_API_PORT=8080
      - PLACE_API_MAX_WORKERS=${PLACE_API_MAX_WORKERS:-1}
      - PLACE_BROWSER_MAX_CONCURRENCY=${PLACE_BROWSER_MAX_CONCURRENCY:-1}
      - PLACE_BROWSER_PAGE_LOAD_STRATEGY=${PLACE_BROWSER_PAGE_LOAD_STRATEGY:-eager}
      - PLACE_BROWSER_BLOCK_NONESSENTIAL=${PLACE_BROWSER_BLOCK_NONESSENTIAL:-true}
      - PLACE_BROWSER_BLOCK_IMAGES=${PLACE_BROWSER_BLOCK_IMAGES:-true}
      - PLACE_JOB_HISTORY_TTL_HOURS=${PLACE_JOB_HISTORY_TTL_HOURS:-24}
      - PLACE_JOB_HISTORY_MAX_COUNT=${PLACE_JOB_HISTORY_MAX_COUNT:-200}
      - GOROUTE_API_URL=${GOROUTE_API_URL:-http://goroute-app:8080/v1/api/places/import}
      - GOROUTE_PLACES_URL=${GOROUTE_PLACES_URL:-http://goroute-app:8080/v1/api/places}
      - GOROUTE_REVIEW_REFRESH_URL=${GOROUTE_REVIEW_REFRESH_URL:-http://goroute-app:8080/v1/api/place-reviews}
      - GOROUTE_API_KEY=${GOROUTE_API_KEY:-}
      - PLACE_REFRESH_ENABLED=${PLACE_REFRESH_ENABLED:-false}
      - PLACE_REFRESH_HOUR=${PLACE_REFRESH_HOUR:-6}
      - PLACE_REFRESH_MINUTE=${PLACE_REFRESH_MINUTE:-0}
      - PLACE_REFRESH_TIMEZONE=${PLACE_REFRESH_TIMEZONE:-Asia/Bangkok}
      - PLACE_REFRESH_MAX_PLACES=${PLACE_REFRESH_MAX_PLACES:-0}
      - PLACE_REFRESH_DELAY_SECONDS=${PLACE_REFRESH_DELAY_SECONDS:-0}
      - PLACE_REFRESH_API_KEY=${PLACE_REFRESH_API_KEY:-}
      - PLACE_REVIEW_REFRESH_ENABLED=${PLACE_REVIEW_REFRESH_ENABLED:-true}
      - PLACE_REVIEW_REFRESH_HOUR=${PLACE_REVIEW_REFRESH_HOUR:-7}
      - PLACE_REVIEW_REFRESH_MINUTE=${PLACE_REVIEW_REFRESH_MINUTE:-0}
      - PLACE_REVIEW_REFRESH_MAX_PLACES=${PLACE_REVIEW_REFRESH_MAX_PLACES:-0}
      - PLACE_REVIEW_REFRESH_MAX_AGE_HOURS=${PLACE_REVIEW_REFRESH_MAX_AGE_HOURS:-24}
      - PLACE_REVIEW_REFRESH_DELAY_SECONDS=${PLACE_REVIEW_REFRESH_DELAY_SECONDS:-0}
      - PLACE_REVIEW_BROWSER_CRASH_RETRIES=${PLACE_REVIEW_BROWSER_CRASH_RETRIES:-1}
      - PLACE_REVIEW_MAX_SCROLLS=${PLACE_REVIEW_MAX_SCROLLS:-300}
      - PLACE_REVIEW_SCRAPE_TIMEOUT_SECONDS=${PLACE_REVIEW_SCRAPE_TIMEOUT_SECONDS:-360}
      - PLACE_BROWSER_COMMAND_TIMEOUT_SECONDS=${PLACE_BROWSER_COMMAND_TIMEOUT_SECONDS:-45}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-DEEPSEEK}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-120}
      - SOCIAL_YTDLP_COOKIE_FILE=${SOCIAL_YTDLP_COOKIE_FILE:-/app/cookies.txt}
      - SOCIAL_YTDLP_IMPERSONATE=${SOCIAL_YTDLP_IMPERSONATE:-chrome}
    expose:
      - "8080"
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
    mem_limit: 2g
    cpus: 1.5
    shm_size: 1gb
    networks:
      - vocaberry-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cambridge-dictionary:
    image: luxofons/dict:v0.0.4
    container_name: cambridge-dictionary-api
    restart: always
    expose:
      - "3006"
    environment:
      - PORT=3005
      - NODE_ENV=production
    networks:
      - vocaberry-network

  minio:
    image: minio/minio:latest
    container_name: vocaberry-minio
    restart: always
    volumes:
      - minio_data:/data
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: admin
      MINIO_SERVER_URL: https://onestudy.id.vn/resource
    expose:
      - "9000"
    networks:
      - vocaberry-network
    command: server /data --console-address ":9001"

  # Image Compression Service
  imgpress:
    image: luxofons/imgpress:v0.1.0
    container_name: imgpress
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_FILE_SIZE_MB=50
      - DEFAULT_QUALITY=80
      - DEFAULT_WIDTH=1600
      - COMPRESS_TIMEOUT_MS=300000
    networks:
      - vocaberry-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: vocaberry-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - vocaberry-app
    networks:
      - vocaberry-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: vocaberry-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  vocaberry_db_data:
  vocaberry_lucene_data:
  goroute_db_data:
  minio_data:

networks:
  vocaberry-network:
    driver: bridge
