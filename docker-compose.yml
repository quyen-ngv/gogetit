version: '3.8'

services:
  google-maps-bot:
    build: .
    image: luxofons/google-maps-bot:latest
    container_name: google-maps-bot
    restart: unless-stopped

    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID:-5636346689}
      - PLACE_API_HOST=0.0.0.0
      - PLACE_API_PORT=8080
      - PLACE_API_MAX_WORKERS=${PLACE_API_MAX_WORKERS:-1}
      - PLACE_BROWSER_MAX_CONCURRENCY=${PLACE_BROWSER_MAX_CONCURRENCY:-1}
      - PLACE_BROWSER_PAGE_LOAD_STRATEGY=${PLACE_BROWSER_PAGE_LOAD_STRATEGY:-eager}
      - PLACE_BROWSER_BLOCK_NONESSENTIAL=${PLACE_BROWSER_BLOCK_NONESSENTIAL:-true}
      - PLACE_BROWSER_BLOCK_IMAGES=${PLACE_BROWSER_BLOCK_IMAGES:-true}
      - PLACE_JOB_HISTORY_TTL_HOURS=${PLACE_JOB_HISTORY_TTL_HOURS:-24}
      - PLACE_JOB_HISTORY_MAX_COUNT=${PLACE_JOB_HISTORY_MAX_COUNT:-200}
      - GOROUTE_API_URL=${GOROUTE_API_URL:-https://onestudy.id.vn/goroute/v1/api/places/import}
      - GOROUTE_PLACES_URL=${GOROUTE_PLACES_URL:-https://onestudy.id.vn/goroute/v1/api/places}
      - GOROUTE_REVIEW_REFRESH_URL=${GOROUTE_REVIEW_REFRESH_URL:-https://onestudy.id.vn/goroute/v1/api/place-reviews}
      - GOROUTE_API_KEY=${GOROUTE_API_KEY:-}
      - PLACE_REFRESH_ENABLED=${PLACE_REFRESH_ENABLED:-false}
      - PLACE_REFRESH_HOUR=${PLACE_REFRESH_HOUR:-6}
      - PLACE_REFRESH_MINUTE=${PLACE_REFRESH_MINUTE:-0}
      - PLACE_REFRESH_TIMEZONE=${PLACE_REFRESH_TIMEZONE:-Asia/Bangkok}
      - PLACE_REFRESH_MAX_PLACES=${PLACE_REFRESH_MAX_PLACES:-0}
      - PLACE_REFRESH_DELAY_SECONDS=${PLACE_REFRESH_DELAY_SECONDS:-0}
      - PLACE_REFRESH_API_KEY=${PLACE_REFRESH_API_KEY:-}
      - PLACE_REVIEW_REFRESH_ENABLED=${PLACE_REVIEW_REFRESH_ENABLED:-true}
      - PLACE_REVIEW_REFRESH_HOUR=${PLACE_REVIEW_REFRESH_HOUR:-7}
      - PLACE_REVIEW_REFRESH_MINUTE=${PLACE_REVIEW_REFRESH_MINUTE:-0}
      - PLACE_REVIEW_REFRESH_MAX_PLACES=${PLACE_REVIEW_REFRESH_MAX_PLACES:-0}
      - PLACE_REVIEW_REFRESH_MAX_AGE_HOURS=${PLACE_REVIEW_REFRESH_MAX_AGE_HOURS:-24}
      - PLACE_REVIEW_REFRESH_DELAY_SECONDS=${PLACE_REVIEW_REFRESH_DELAY_SECONDS:-0}
      - PLACE_REVIEW_BROWSER_CRASH_RETRIES=${PLACE_REVIEW_BROWSER_CRASH_RETRIES:-1}
      - PLACE_REVIEW_MAX_SCROLLS=${PLACE_REVIEW_MAX_SCROLLS:-300}
      - PLACE_REVIEW_SCRAPE_TIMEOUT_SECONDS=${PLACE_REVIEW_SCRAPE_TIMEOUT_SECONDS:-360}
      - PLACE_BROWSER_COMMAND_TIMEOUT_SECONDS=${PLACE_BROWSER_COMMAND_TIMEOUT_SECONDS:-45}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-DEEPSEEK}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-120}
      - SOCIAL_YTDLP_COOKIE_FILE=${SOCIAL_YTDLP_COOKIE_FILE:-/app/cookies.txt}
      - SOCIAL_YTDLP_IMPERSONATE=${SOCIAL_YTDLP_IMPERSONATE:-chrome}

    expose:
      - "8080"

    volumes:
      - ./logs:/app/logs
      - ./output:/app/output

    mem_limit: 2g
    cpus: 1.5
    shm_size: 1gb

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
